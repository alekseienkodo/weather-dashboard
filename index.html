<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Погодний дашборд</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
<header>
    <h1>Погодний дашборд</h1>
    <nav>
        <a href="#current">Поточна погода</a>
        <a href="#forecast">Прогноз</a>
    </nav>
</header>
<main>
    <div class="current-layout">
        <section id="current" class="mild">
            <h2>Поточна погода</h2>
            <div class="current-weather">
                <img src="assets/img/sun.svg" alt="">
                <p><strong class="temperature">+11&deg;C</strong><br>Ясно</p>
            </div>
        </section>
        <aside>
            <p>Краще вдягнути легкий одяг.(приклад)</p>
        </aside>
    </div>
    <section id="forecast">
        <h2>Прогноз на тиждень</h2>
        <div class="cards">
        <article class="card mild">
            <h3>Понеділок</h3>
            <p><strong class="temperature">+10&deg;C</strong><br>Дощ</p>
        </article>
        </div>
        <p id="avg-temp"></p>
        <form id="forecast-form">
            <label for="forecast-day">День тижня</label>
            <input type="text" id="forecast-day" name="day" required>

            <label for="forecast-temp">Температура, °C</label>
            <input type="number" id="forecast-temp" name="tempC"
                   min="-50" max="50" step="any" required>

            <label for="forecast-description">Опис погоди</label>
            <input type="text" id="forecast-description" name="description">

            <button type="submit">Додати прогноз</button>
        </form>
        <button type="button" id="warmest-day-button">Найтепліший день</button>
        <p id="warmest-day-result"></p>
    </section>
</main>

<footer>
    <p>Дані надані навчальним прикладом=). &copy; 2026</p>
</footer>
</body>
</html>
